
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Interyer Dizayni</title>

    <!-- A-Frame kutubxonasi -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Hit-test komponenti -->
    <script src="js/hit-test.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        header {
            background: #263b63;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            margin: 5px;
        }

        .panel {
            padding: 12px;
            text-align: center;
            background: white;
        }

        button {
            padding: 12px 16px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #263b63;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #4169a8;
        }

        #holat {
            text-align: center;
            padding: 12px;
            color: #263b63;
            font-weight: bold;
        }

        .izoh {
            text-align: center;
            padding: 10px;
            color: #555;
        }

        a-scene {
            width: 100%;
            height: 55vh;
        }
    </style>
</head>

<body>

    <header>
        <h1>AR INTERYER DIZAYNI</h1>
        <p>Virtual mebellarni xonangizda joylashtiring</p>
    </header>

    <div class="panel">
        <button id="arButton">AR rejimini boshlash</button>
        <button onclick="modelTanlash('divan')">Divan</button>
        <button onclick="modelTanlash('stul')">Stul</button>
        <button onclick="modelTanlash('stol')">Stol</button>
        <button id="rotateButton">Burish</button>
        <button id="scaleButton">Kattalashtirish</button>
        <button id="deleteButton">O‘chirish</button>
        <button id="clearButton">Tozalash</button>
    </div>

    <div id="holat">
        Kerakli mebelni tanlang.
    </div>

    <p class="izoh">
        AR rejimida polni aniqlang va mebelni joylashtiring.
    </p>

    <a-scene
        hit-test
        webxr="requiredFeatures: hit-test, local-floor;
               optionalFeatures: light-estimation"
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true">

        <a-assets>
            <a-asset-item
                id="divanModel"
                src="assets/models/divan.glb">
            </a-asset-item>

            <a-asset-item
                id="stulModel"
                src="assets/models/stul.glb">
            </a-asset-item>

            <a-asset-item
                id="stolModel"
                src="assets/models/stol.glb">
            </a-asset-item>
        </a-assets>

        <!-- Polni aniqlovchi belgi -->
        <a-entity
            id="reticle"
            geometry="primitive: ring;
                      radiusInner: 0.08;
                      radiusOuter: 0.12"
            material="color: green; shader: flat"
            rotation="-90 0 0"
            visible="false">
        </a-entity>

        <!-- Yoritish -->
        <a-entity
            light="type: ambient; intensity: 0.8">
        </a-entity>

        <a-entity
            light="type: directional; intensity: 0.7"
            position="1 3 2">
        </a-entity>

        <a-camera position="0 1.6 0"></a-camera>

    </a-scene>

    <!-- Asosiy JavaScript kodi -->
    <script src="js/app.js"></script>

</body>
</html>

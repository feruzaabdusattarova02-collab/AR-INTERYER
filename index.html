
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Interyer Dizayni</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            text-align: center;
        }

        h1 {
            color: #183b70;
            padding: 12px;
            margin: 0;
        }

        .panel {
            padding: 12px;
            background: white;
            box-shadow: 0 3px 10px #0002;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #245da8;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #153d73;
        }

        .ranglar {
            background: #f5f7fc;
            padding: 8px;
        }

        a-scene {
            width: 100%;
            height: 70vh;
        }
    </style>
</head>

<body>

<h1>AR Interyer Dizayni</h1>

<div class="panel">
    <button onclick="kameraniYoqish()">Kamerani yoqish</button>
    <button onclick="aylantir()">Aylantirish</button>
    <button onclick="kattalashtir()">Kattalashtirish</button>
    <button onclick="kichraytir()">Kichraytirish</button>
    <button onclick="qaytaTiklash()">Qayta tiklash</button>
</div>

<div class="ranglar">
    <b>Xona ranglari:</b>
    <button onclick="polRangi('#d8c5a8')">Och jigarrang pol</button>
    <button onclick="polRangi('#b8c9d9')">Kulrang pol</button>
    <button onclick="devorRangi('#f3eee5')">Oq devor</button>
    <button onclick="devorRangi('#d8e6f5')">Moviy devor</button>
</div>

<a-scene embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false">

    <a-sky color="#c8dced"></a-sky>

    <!-- POL -->
    <a-plane id="pol"
        rotation="-90 0 0"
        width="14"
        height="14"
        color="#d8c5a8">
    </a-plane>

    <!-- ORQA DEVOR -->
    <a-box id="devor"
        position="0 2 -5"
        width="12"
        height="4"
        depth="0.15"
        color="#f3eee5">
    </a-box>

    <!-- GILAM -->
    <a-plane
        position="0 0.025 -2.7"
        rotation="-90 0 0"
        width="5"
        height="3.5"
        color="#a98291">
    </a-plane>

    <a-plane
        position="0 0.04 -2.7"
        rotation="-90 0 0"
        width="4.6"
        height="3.1"
        color="#c9a9b4">
    </a-plane>

    <!-- DERAZA -->
    <a-box position="-2.8 2.3 -4.88"
        width="2.2"
        height="1.5"
        depth="0.05"
        color="#8cc9e8">
    </a-box>

    <a-box position="-2.8 2.3 -4.82"
        width="0.06"
        height="1.5"
        depth="0.08"
        color="#ffffff">
    </a-box>

    <a-box position="-2.8 2.3 -4.82"
        width="2.2"
        height="0.06"
        depth="0.08"
        color="#ffffff">
    </a-box>

    <!-- DEVOR RASMI -->
    <a-box position="0.8 2.8 -4.87"
        width="1.5"
        height="1.1"
        depth="0.08"
        color="#704b36">
    </a-box>

    <a-box position="0.8 2.8 -4.81"
        width="1.3"
        height="0.9"
        depth="0.03"
        color="#e5d2a5">
    </a-box>

    <a-triangle
        position="0.8 2.8 -4.77"
        rotation="0 0 0"
        vertex-a="-0.5 -0.25 0"
        vertex-b="0.5 -0.25 0"
        vertex-c="0 0.45 0"
        color="#4b8b69">
    </a-triangle>

    <!-- DIVAN -->
    <a-entity id="divan"
        gltf-model="url(./divan.glb)"
        position="-1.55 0 -3.25"
        rotation="0 0 0"
        scale="0.75 0.75 0.75">
    </a-entity>

    <!-- STOL -->
    <a-entity id="stol"
        gltf-model="url(./stol.glb)"
        position="0 0 -1.55"
        rotation="0 0 0"
        scale="0.55 0.55 0.55">
    </a-entity>

    <!-- KRESLO -->
    <a-entity id="kreslo"
        gltf-model="url(./stul.glb)"
        position="1.65 0 -2.8"
        rotation="0 -35 0"
        scale="0.60 0.60 0.60">
    </a-entity>

    <!-- CHAP TOMONDA PALMA -->
    <a-entity position="-3.7 0 -3.7">
        <a-cylinder position="0 0.25 0"
            radius="0.3"
            height="0.5"
            color="#a66b42">
        </a-cylinder>

        <a-cylinder position="0 1.1 0"
            radius="0.07"
            height="1.7"
            color="#79502c">
        </a-cylinder>

        <a-sphere position="0 2 0"
            radius="0.48"
            color="#278344">
        </a-sphere>

        <a-sphere position="-0.35 1.8 0"
            radius="0.35"
            color="#359b50">
        </a-sphere>

        <a-sphere position="0.35 1.8 0"
            radius="0.35"
            color="#359b50">
        </a-sphere>

        <a-sphere position="0 2.25 0.25"
            radius="0.3"
            color="#42a65a">
        </a-sphere>
    </a-entity>

    <!-- O'NG TOMONDA KAKTUS -->
    <a-entity position="3.6 0 -3.6">
        <a-cylinder position="0 0.2 0"
            radius="0.3"
            height="0.4"
            color="#b8794e">
        </a-cylinder>

        <a-cylinder position="0 0.9 0"
            radius="0.2"
            height="1.2"
            color="#278344">
        </a-cylinder>

        <a-cylinder position="-0.22 0.85 0"
            radius="0.1"
            height="0.55"
            color="#278344">
        </a-cylinder>

        <a-cylinder position="-0.32 1.1 0"
            radius="0.1"
            height="0.35"
            color="#278344">
        </a-cylinder>

        <a-cylinder position="0.22 0.95 0"
            radius="0.1"
            height="0.5"
            color="#278344">
        </a-cylinder>
    </a-entity>

    <!-- RANGLI GULLAR -->
    <a-entity position="-3.2 0 -1.5">
        <a-cylinder position="0 0.18 0"
            radius="0.23"
            height="0.36"
            color="#c47b50">
        </a-cylinder>

        <a-cylinder position="0 0.65 0"
            radius="0.035"
            height="0.65"
            color="#348b45">
        </a-cylinder>

        <a-sphere position="0 1 0"
            radius="0.13"
            color="#e94b88">
        </a-sphere>

        <a-sphere position="0.15 0.9 0"
            radius="0.12"
            color="#f4a1bd">
        </a-sphere>

        <a-sphere position="-0.15 0.9 0"
            radius="0.12"
            color="#f4a1bd">
        </a-sphere>

        <a-sphere position="0 0.85 0.15"
            radius="0.12"
            color="#f4a1bd">
        </a-sphere>

        <a-sphere position="0 0.85 -0.15"
            radius="0.12"
            color="#f4a1bd">
        </a-sphere>

        <a-sphere position="0 0.9 0"
            radius="0.07"
            color="#f5d34f">
        </a-sphere>
    </a-entity>

    <!-- SARIQ GULLAR -->
    <a-entity position="3.1 0 -1.4">
        <a-cylinder position="0 0.18 0"
            radius="0.23"
            height="0.36"
            color="#a66b42">
        </a-cylinder>

        <a-cylinder position="0 0.65 0"
            radius="0.035"
            height="0.65"
            color="#348b45">
        </a-cylinder>

        <a-sphere position="0 1 0"
            radius="0.14"
            color="#ffcf45">
        </a-sphere>

        <a-sphere position="0.15 0.9 0"
            radius="0.12"
            color="#ffdf70">
        </a-sphere>

        <a-sphere position="-0.15 0.9 0"
            radius="0.12"
            color="#ffdf70">
        </a-sphere>

        <a-sphere position="0 0.85 0.15"
            radius="0.12"
            color="#ffdf70">
        </a-sphere>

        <a-sphere position="0 0.85 -0.15"
            radius="0.12"
            color="#ffdf70">
        </a-sphere>
    </a-entity>

    <!-- YANA BIR KICHIK O'SIMLIK -->
    <a-entity position="2.7 0 -4.2">
        <a-cylinder position="0 0.2 0"
            radius="0.22"
            height="0.4"
            color="#bd8258">
        </a-cylinder>

        <a-sphere position="0 0.7 0"
            radius="0.38"
            color="#32934b">
        </a-sphere>

        <a-sphere position="-0.2 0.8 0"
            radius="0.25"
            color="#45a85b">
        </a-sphere>

        <a-sphere position="0.2 0.8 0"
            radius="0.25"
            color="#45a85b">
        </a-sphere>
    </a-entity>

    <!-- YORUG'LIK -->
    <a-light type="ambient" intensity="0.8"></a-light>

    <a-light type="directional"
        position="-2 5 3"
        intensity="0.8">
    </a-light>

    <!-- KAMERA -->
    <a-camera position="0 1.6 0"></a-camera>

</a-scene>

<script>
    let videoElement = null;
    let oqim = null;

    function kameraniYoqish() {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            alert("Kamera uchun HTTPS orqali oching.");
            return;
        }

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        })
        .then(function(stream) {
            oqim = stream;

            if (!videoElement) {
                videoElement = document.createElement("video");

                videoElement.autoplay = true;
                videoElement.playsInline = true;
                videoElement.muted = true;

                videoElement.style.position = "fixed";
                videoElement.style.top = "0";
                videoElement.style.left = "0";
                videoElement.style.width = "100%";
                videoElement.style.height = "100%";
                videoElement.style.objectFit = "cover";
                videoElement.style.zIndex = "-1";

                document.body.prepend(videoElement);
            }

            videoElement.srcObject = stream;
            videoElement.play();
        })
        .catch(function() {
            alert("Kamerani yoqib bo'lmadi. Ruxsatni tekshiring.");
        });
    }

    function aylantir() {
        ["divan", "stol", "kreslo"].forEach(function(id) {
            const mebel = document.getElementById(id);
            const eski = mebel.getAttribute("rotation");

            mebel.setAttribute("rotation", {
                x: eski.x,
                y: eski.y + 15,
                z: eski.z
            });
        });
    }

    function kattalashtir() {
        ["divan", "stol", "kreslo"].forEach(function(id) {
            const mebel = document.getElementById(id);
            const s = mebel.getAttribute("scale");

            mebel.setAttribute("scale", {
                x: s.x + 0.05,
                y: s.y + 0.05,
                z: s.z + 0.05
            });
        });
    }

    function kichraytir() {
        ["divan", "stol", "kreslo"].forEach(function(id) {
            const mebel = document.getElementById(id);
            const s = mebel.getAttribute("scale");

            mebel.setAttribute("scale", {
                x: Math.max(0.2, s.x - 0.05),
                y: Math.max(0.2, s.y - 0.05),
                z: Math.max(0.2, s.z - 0.05)
            });
        });
    }

    function polRangi(rang) {
        document.getElementById("pol").setAttribute("color", rang);
    }

    function devorRangi(rang) {
        document.getElementById("devor").setAttribute("color", rang);
    }

    function qaytaTiklash() {
        const boshlangich = {
            divan: {
                position: "-1.55 0 -3.25",
                rotation: "0 0 0",
                scale: "0.75 0.75 0.75"
            },
            stol: {
                position: "0 0 -1.55",
                rotation: "0 0 0",
                scale: "0.55 0.55 0.55"
            },
            kreslo: {
                position: "1.65 0 -2.8",
                rotation: "0 -35 0",
                scale: "0.60 0.60 0.60"
            }
        };

        Object.keys(boshlangich).forEach(function(id) {
            const mebel = document.getElementById(id);
            mebel.setAttribute("position", boshlangich[id].position);
            mebel.setAttribute("rotation", boshlangich[id].rotation);
            mebel.setAttribute("scale", boshlangich[id].scale);
        });

        polRangi("#d8c5a8");
        devorRangi("#f3eee5");
    }
</script>

</body>
</html>

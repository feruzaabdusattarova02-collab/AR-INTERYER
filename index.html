
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Interyer Dizayni</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        header {
            background: #263b63;
            color: white;
            padding: 20px 10px;
            text-align: center;
        }

        header h1 {
            margin: 5px;
            font-size: 30px;
        }

        header p {
            font-size: 17px;
        }

        .panel {
            background: white;
            padding: 15px 8px;
            text-align: center;
        }

        button {
            background: #263b63;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 13px 17px;
            margin: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4169a8;
        }

        #holat {
            text-align: center;
            padding: 15px;
            color: #263b63;
            font-weight: bold;
            font-size: 17px;
        }

        .izoh {
            text-align: center;
            color: #555;
            padding: 5px 15px;
        }

        a-scene {
            width: 100%;
            height: 65vh;
            display: block;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>AR INTERYER DIZAYNI</h1>
    <p>Virtual mebellarni xonangizda joylashtiring</p>
</header>

<div class="panel">
    <button id="startButton">3D ko‘rinishni boshlash</button>
    <button onclick="modelTanlash('divan')">Divan</button>
    <button onclick="modelTanlash('stul')">Stul</button>
    <button onclick="modelTanlash('stol')">Stol</button>
    <button id="rotateButton">Burish</button>
    <button id="scaleButton">Kattalashtirish</button>
    <button id="deleteButton">O‘chirish</button>
    <button id="clearButton">Tozalash</button>
</div>

<div id="holat">Kerakli mebelni tanlang.</div>

<p class="izoh">
    3D ko‘rinishda mebellarni tanlang, burang va kattalashtiring.
</p>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true">

    <a-sky color="#eaf0f8"></a-sky>

    <!-- Pol -->
    <a-plane
        rotation="-90 0 0"
        width="12"
        height="12"
        color="#d5dce7"
        position="0 0 0">
    </a-plane>

    <!-- Orqa devor -->
    <a-plane
        width="12"
        height="5"
        color="#f4f0e9"
        position="0 2.5 -4">
    </a-plane>

    <!-- Yoritish -->
    <a-entity light="type: ambient; intensity: 1"></a-entity>

    <a-entity
        light="type: directional; intensity: 1"
        position="2 5 3">
    </a-entity>

    <!-- Kamera -->
    <a-camera position="0 2 7" rotation="-10 0 0">
    </a-camera>

</a-scene>

<script>
const scene = document.querySelector("a-scene");
const holat = document.getElementById("holat");

let tanlanganObyekt = null;

// Holat yozuvini o'zgartirish
function xabar(matn) {
    holat.textContent = matn;
}

// Mebel qismlarini yaratish
function detal(parent, tur, rang, position, scale) {
    const qism = document.createElement("a-entity");

    qism.setAttribute("geometry", "primitive: " + tur);
    qism.setAttribute("material", "color: " + rang);
    qism.setAttribute("position", position);
    qism.setAttribute("scale", scale);

    parent.appendChild(qism);
    return qism;
}

// Divan yaratish
function divanYarat() {
    const g = document.createElement("a-entity");

    g.setAttribute("position", "0 0 0");

    detal(g, "box", "#526b91",
        "0 0.55 0", "1.8 0.35 0.8");

    detal(g, "box", "#405779",
        "0 0.9 -0.3", "1.8 0.5 0.15");

    detal(g, "box", "#405779",
        "-0.8 0.65 0", "0.2 0.65 0.8");

    detal(g, "box", "#405779",
        "0.8 0.65 0", "0.2 0.65 0.8");

    scene.appendChild(g);
    return g;
}

// Stul yaratish
function stulYarat() {
    const g = document.createElement("a-entity");

    g.setAttribute("position", "0 0 0");

    detal(g, "box", "#b87943",
        "0 0.8 0", "0.8 0.15 0.8");

    detal(g, "box", "#87552f",
        "0 1.2 -0.3", "0.8 0.8 0.15");

    detal(g, "cylinder", "#65452e",
        "-0.3 0.4 -0.3", "0.07 0.8 0.07");

    detal(g, "cylinder", "#65452e",
        "0.3 0.4 -0.3", "0.07 0.8 0.07");

    detal(g, "cylinder", "#65452e",
        "-0.3 0.4 0.3", "0.07 0.8 0.07");

    detal(g, "cylinder", "#65452e",
        "0.3 0.4 0.3", "0.07 0.8 0.07");

    scene.appendChild(g);
    return g;
}

// Stol yaratish
function stolYarat() {
    const g = document.createElement("a-entity");

    g.setAttribute("position", "0 0 0");

    detal(g, "box", "#a8794d",
        "0 0.9 0", "1.5 0.15 1");

    detal(g, "cylinder", "#65452e",
        "-0.6 0.45 -0.35", "0.08 0.9 0.08");

    detal(g, "cylinder", "#65452e",
        "0.6 0.45 -0.35", "0.08 0.9 0.08");

    detal(g, "cylinder", "#65452e",
        "-0.6 0.45 0.35", "0.08 0.9 0.08");

    detal(g, "cylinder", "#65452e",
        "0.6 0.45 0.35", "0.08 0.9 0.08");

    scene.appendChild(g);
    return g;
}

// Mebel tanlash
function modelTanlash(nom) {
    if (tanlanganObyekt) {
        tanlanganObyekt.remove();
    }

    if (nom === "divan") {
        tanlanganObyekt = divanYarat();
    }

    if (nom === "stul") {
        tanlanganObyekt = stulYarat();
    }

    if (nom === "stol") {
        tanlanganObyekt = stolYarat();
    }

    tanlanganObyekt.classList.add("mebel");

    xabar(nom.toUpperCase() + " yaratildi!");
}

// 3D ko'rinishni boshlash
document.getElementById("startButton")
.addEventListener("click", function() {
    xabar("3D interyer tayyor! Mebel tanlang.");
});

// Burish
document.getElementById("rotateButton")
.addEventListener("click", function() {
    if (!tanlanganObyekt) {
        xabar("Avval mebel tanlang!");
        return;
    }

    tanlanganObyekt.object3D.rotation.y += Math.PI / 6;
    xabar("Mebel burildi.");
});

// Kattalashtirish
document.getElementById("scaleButton")
.addEventListener("click", function() {
    if (!tanlanganObyekt) {
        xabar("Avval mebel tanlang!");
        return;
    }

    tanlanganObyekt.object3D.scale.multiplyScalar(1.15);
    xabar("Mebel kattalashtirildi.");
});

// O'chirish
document.getElementById("deleteButton")
.addEventListener("click", function() {
    if (tanlanganObyekt) {
        tanlanganObyekt.remove();
        tanlanganObyekt = null;
        xabar("Mebel o‘chirildi.");
    }
});

// Barcha mebellarni o'chirish
document.getElementById("clearButton")
.addEventListener("click", function() {
    scene.querySelectorAll(".mebel").forEach(function(item) {
        item.remove();
    });

    tanlanganObyekt = null;
    xabar("Barcha mebellar o‘chirildi.");
});
</script>

<footer>
    AR Interyer Dizayni — 3D loyiha
</footer>

</body>
</html>

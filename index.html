
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Interyer Dizayni</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            text-align: center;
        }

        h1 {
            color: #183b70;
            padding: 10px;
        }

        .panel {
            padding: 10px;
            background: white;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #245da8;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #153d73;
        }

        a-scene {
            width: 100%;
            height: 70vh;
        }
    </style>
</head>

<body>

<h1>AR Interyer Dizayni</h1>

<div class="panel">
    <button onclick="kameraniYoqish()">Kamerani yoqish</button>
    <button onclick="aylantir()">Aylantirish</button>
    <button onclick="kattalashtir()">Kattalashtirish</button>
    <button onclick="kichraytir()">Kichraytirish</button>
    <button onclick="qaytaTiklash()">Qayta tiklash</button>
</div>

<a-scene embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false">

    <a-sky color="#c8dced"></a-sky>

    <!-- Pol -->
    <a-plane
        rotation="-90 0 0"
        width="14"
        height="14"
        color="#d8c5a8">
    </a-plane>

    <!-- Orqa devor -->
    <a-box
        position="0 2 -5"
        width="12"
        height="4"
        depth="0.15"
        color="#f3eee5">
    </a-box>

    <!-- Gilam -->
    <a-plane
        position="0 0.02 -2.7"
        rotation="-90 0 0"
        width="5"
        height="3.5"
        color="#b7a0a0">
    </a-plane>

    <!-- Deraza -->
    <a-box position="-2.8 2.3 -4.88"
        width="2.2" height="1.5" depth="0.05"
        color="#8cc9e8">
    </a-box>

    <!-- Divan -->
    <a-entity id="divan"
        gltf-model="url(divan.glb)"
        position="-1.35 0 -3.1"
        rotation="0 0 0"
        scale="0.75 0.75 0.75">
    </a-entity>

    <!-- Stol: oldinroqda -->
    <a-entity id="stol"
        gltf-model="url(stol.glb)"
        position="0 0 -1.65"
        rotation="0 0 0"
        scale="0.65 0.65 0.65">
    </a-entity>

    <!-- Kreslo: stolga qaragan -->
    <a-entity id="kreslo"
        gltf-model="url(stul.glb)"
        position="1.45 0 -2.65"
        rotation="0 55 0"
        scale="0.65 0.65 0.65">
    </a-entity>

    <!-- O'simliklar -->
    <a-entity position="-3.5 0 -3.8">
        <a-cylinder position="0 0.2 0"
            radius="0.25" height="0.4"
            color="#a66b42"></a-cylinder>
        <a-cylinder position="0 1 0"
            radius="0.06" height="1.3"
            color="#397d42"></a-cylinder>
        <a-sphere position="0 1.5 0"
            radius="0.5" color="#32834a"></a-sphere>
        <a-sphere position="-0.3 1.2 0"
            radius="0.35" color="#3b9953"></a-sphere>
        <a-sphere position="0.3 1.2 0"
            radius="0.35" color="#3b9953"></a-sphere>
    </a-entity>

    <a-entity position="3.5 0 -3.8">
        <a-cylinder position="0 0.2 0"
            radius="0.25" height="0.4"
            color="#a66b42"></a-cylinder>
        <a-cylinder position="0 0.8 0"
            radius="0.12" height="1.2"
            color="#278344"></a-cylinder>
        <a-sphere position="0 1.4 0"
            radius="0.35" color="#278344"></a-sphere>
    </a-entity>

    <!-- Yorug'lik -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional"
        position="-2 5 3"
        intensity="0.7">
    </a-light>

    <!-- Kamera -->
    <a-camera position="0 1.6 0"></a-camera>

</a-scene>

<script>
    let videoElement = null;
    let oqim = null;
    let aylanish = 0;
    let masshtab = 1;

    function kameraniYoqish() {
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
        })
        .then(function(stream) {
            oqim = stream;

            if (!videoElement) {
                videoElement = document.createElement("video");
                videoElement.autoplay = true;
                videoElement.playsInline = true;
                videoElement.muted = true;

                videoElement.style.position = "fixed";
                videoElement.style.top = "0";
                videoElement.style.left = "0";
                videoElement.style.width = "100%";
                videoElement.style.height = "100%";
                videoElement.style.objectFit = "cover";
                videoElement.style.zIndex = "-1";

                document.body.prepend(videoElement);
            }

            videoElement.srcObject = stream;
            videoElement.play();
        })
        .catch(function() {
            alert("Kamerani yoqib bo'lmadi. Ruxsat berilganini tekshiring.");
        });
    }

    function aylantir() {
        aylanish += 15;

        ["divan", "stol", "kreslo"].forEach(function(id) {
            let mebel = document.getElementById(id);
            let eski = mebel.getAttribute("rotation");
            mebel.setAttribute("rotation", {
                x: eski.x,
                y: eski.y + 15,
                z: eski.z
            });
        });
    }

    function kattalashtir() {
        masshtab += 0.1;
        ["divan", "stol", "kreslo"].forEach(function(id) {
            let mebel = document.getElementById(id);
            let s = mebel.getAttribute("scale");
            mebel.setAttribute("scale", {
                x: s.x + 0.05,
                y: s.y + 0.05,
                z: s.z + 0.05
            });
        });
    }

    function kichraytir() {
        ["divan", "stol", "kreslo"].forEach(function(id) {
            let mebel = document.getElementById(id);
            let s = mebel.getAttribute("scale");
            mebel.setAttribute("scale", {
                x: Math.max(0.2, s.x - 0.05),
                y: Math.max(0.2, s.y - 0.05),
                z: Math.max(0.2, s.z - 0.05)
            });
        });
    }

    function qaytaTiklash() {
        document.getElementById("divan").setAttribute(
            "position", "-1.35 0 -3.1");
        document.getElementById("divan").setAttribute(
            "rotation", "0 0 0");
        document.getElementById("divan").setAttribute(
            "scale", "0.75 0.75 0.75");

        document.getElementById("stol").setAttribute(
            "position", "0 0 -1.65");
        document.getElementById("stol").setAttribute(
            "rotation", "0 0 0");
        document.getElementById("stol").setAttribute(
            "scale", "0.65 0.65 0.65");

        document.getElementById("kreslo").setAttribute(
            "position", "1.45 0 -2.65");
        document.getElementById("kreslo").setAttribute(
            "rotation", "0 55 0");
        document.getElementById("kreslo").setAttribute(
            "scale", "0.65 0.65 0.65");
    }
</script>

</body>
</html>

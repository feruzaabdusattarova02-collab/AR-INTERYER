<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Interyer Dizayni</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#222; }
#kamera {
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; display:none; z-index:0;
}
a-scene {
  position:fixed !important; inset:0;
  width:100%; height:100%; z-index:1;
}
#panel {
  position:fixed; top:10px; left:0; right:0;
  z-index:5; text-align:center; padding:10px;
}
button {
  padding:10px 13px; margin:4px; border:0;
  border-radius:8px; background:#0756b5;
  color:white; font-size:14px;
}
h2 { color:white; text-shadow:1px 1px 4px black; }
</style>
</head>

<body>

<video id="kamera" autoplay playsinline muted></video>

<div id="panel">
<h2>AR INTERYER DIZAYNI</h2>
<button onclick="kameraniYoq()">Kamerani yoqish</button>
<button onclick="uchDRejim()">3D xona</button>
<br>
<button onclick="mebel('divan')">Divan</button>
<button onclick="mebel('stul')">Stul</button>
<button onclick="mebel('stol')">Stol</button>
<br>
<button onclick="burish()">Burish</button>
<button onclick="kattalashtir()">Kattalashtirish</button>
<button onclick="ochirish()">O‘chirish</button>
<button onclick="tozalash()">Tozalash</button>
<p id="xabar" style="color:white"></p>
</div>

<a-scene embedded
 renderer="alpha:true; colorManagement:true"
 vr-mode-ui="enabled:false">

 <a-entity id="xona">
   <a-sky color="#b9dafa"></a-sky>
   <a-plane rotation="-90 0 0" width="15" height="15"
      color="#d9c5a3"></a-plane>
   <a-plane position="0 2 -5" width="15" height="4"
      color="#eeeeee"></a-plane>
 </a-entity>

 <a-entity light="type:ambient; intensity:1"></a-entity>
 <a-entity light="type:directional; intensity:1"
    position="-2 4 3"></a-entity>

 <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
const sahna = document.querySelector("a-scene");
const xona = document.querySelector("#xona");
const video = document.querySelector("#kamera");
let tanlangan = null;
let oqim = null;

function detal(ota, shakl, joy, olcham, rang) {
  const e = document.createElement("a-entity");
  e.setAttribute("geometry", "primitive:" + shakl);
  e.setAttribute("position", joy);
  e.setAttribute("scale", olcham);
  e.setAttribute("material", "color:" + rang);
  ota.appendChild(e);
  return e;
}

function mebel(tur) {
  if (tanlangan) tanlangan.remove();

  const ota = document.createElement("a-entity");
  ota.setAttribute("position", "0 0 -3");
  sahna.appendChild(ota);
  tanlangan = ota;

  if (tur === "divan") {
    detal(ota,"box","0 0.45 0","1.8 0.5 0.8","#3979bd");
    detal(ota,"box","0 0.9 -0.3","1.8 0.7 0.2","#28629e");
    detal(ota,"box","-0.85 0.65 0","0.2 0.6 0.8","#3979bd");
    detal(ota,"box","0.85 0.65 0","0.2 0.6 0.8","#3979bd");
  }

  if (tur === "stul") {
    detal(ota,"box","0 0.6 0","0.8 0.15 0.8","#a66b35");
    detal(ota,"box","0 1 -0.3","0.8 0.8 0.15","#8b572a");
    detal(ota,"box","-0.3 0.25 0","0.1 0.6 0.1","#654321");
    detal(ota,"box","0.3 0.25 0","0.1 0.6 0.1","#654321");
  }

  if (tur === "stol") {
    detal(ota,"box","0 0.9 0","1.5 0.12 0.9","#9b6335");
    detal(ota,"box","-0.6 0.4 -0.3","0.12 0.8 0.12","#654321");
    detal(ota,"box","0.6 0.4 -0.3","0.12 0.8 0.12","#654321");
    detal(ota,"box","-0.6 0.4 0.3","0.12 0.8 0.12","#654321");
    detal(ota,"box","0.6 0.4 0.3","0.12 0.8 0.12","#654321");
  }
}

async function kameraniYoq() {
  try {
    oqim = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
    video.srcObject = oqim;
    video.style.display = "block";
    xona.setAttribute("visible", "false");
    document.querySelector("#xabar").textContent =
      "Kamera yoqildi. Mebel tugmalaridan foydalaning.";
  } catch (xato) {
    document.querySelector("#xabar").textContent =
      "Kamera ochilmadi. Brauzer ruxsatini tekshiring.";
  }
}

function uchDRejim() {
  video.style.display = "none";
  xona.setAttribute("visible", "true");
  document.querySelector("#xabar").textContent =
    "3D xona rejimi yoqildi.";
}

function burish() {
  if (tanlangan) {
    let r = tanlangan.getAttribute("rotation");
    tanlangan.setAttribute("rotation",
      {x:r.x, y:r.y + 30, z:r.z});
  }
}

function kattalashtir() {
  if (tanlangan) {
    let s = tanlangan.getAttribute("scale");
    tanlangan.setAttribute("scale",
      {x:s.x*1.2, y:s.y*1.2, z:s.z*1.2});
  }
}

function ochirish() {
  if (tanlangan) {
    tanlangan.remove();
    tanlangan = null;
  }
}

function tozalash() {
  sahna.querySelectorAll("a-entity[position='0 0 -3']")
    .forEach(e => e.remove());
  tanlangan = null;
}
</script>

</body>
</html>
